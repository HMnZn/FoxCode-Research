[project]
name = "foxcode-workspace"
version = "0.1.0"
description = "Lightweight research-oriented coding agent"
requires-python = ">=3.12"
dependencies = ["fox-ai", "fox-agent-core", "fox-coding-agent", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.28,<1"]

[tool.uv.workspace]
members = ["packages/fox_ai", "packages/fox_agent_core", "packages/fox_coding_agent"]

[tool.uv.sources]
fox-ai = { workspace = true }
fox-agent-core = { workspace = true }
fox-coding-agent = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
