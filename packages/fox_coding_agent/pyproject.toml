[project]
name = "fox-coding-agent"
version = "0.1.0"
description = "Task-aware context, project memory and evolving skills"
requires-python = ">=3.12"
dependencies = ["fox-agent-core", "fox-ai"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.scripts]
fox = "fox_coding_agent.src.cli:main"

[tool.setuptools]
packages = ["fox_coding_agent.src", "fox_coding_agent.src.context", "fox_coding_agent.src.memory", "fox_coding_agent.src.skills"]
package-dir = {"fox_coding_agent.src" = "src", "fox_coding_agent.src.context" = "src/context", "fox_coding_agent.src.memory" = "src/memory", "fox_coding_agent.src.skills" = "src/skills"}
