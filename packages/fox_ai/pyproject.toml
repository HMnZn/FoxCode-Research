[project]
name = "fox-ai"
version = "0.1.0"
description = "Thin OpenAI-compatible model adapter"
requires-python = ">=3.12"
dependencies = ["openai>=1.60,<4"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fox_ai.src"]
package-dir = {"fox_ai.src" = "src"}
